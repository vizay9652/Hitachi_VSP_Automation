[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test*

# Force pytest to capture and display live consoleoutputs during execution
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)s] %(message)s (%(filename)s:%(lineno)s)
log_cli_date_format = %Y-%m-%d %H:%M:%S

markers =
    fabric: Run baseline connection and volume mapping tests
    chaos: Run destructive link cuts and service crash tests